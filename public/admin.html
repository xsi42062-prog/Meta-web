<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>admin.opons.it.com 管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body class="bg-slate-100 text-slate-900 min-h-screen p-6">
    <div class="max-w-6xl mx-auto space-y-6">
      <header class="flex items-center justify-between">
        <div>
          <p class="uppercase text-xs tracking-widest text-slate-500">admin.opons.it.com</p>
          <h1 class="text-2xl font-bold">管理后台</h1>
        </div>
        <a href="/" class="text-sm px-3 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50">前端站点</a>
      </header>

      <section class="grid md:grid-cols-4 gap-4">
        <div class="bg-white rounded-xl border border-slate-200 p-4"><p class="text-xs text-slate-500">总用户数</p><p id="total-users" class="text-2xl font-bold mt-2">--</p></div>
        <div class="bg-white rounded-xl border border-slate-200 p-4"><p class="text-xs text-slate-500">正常用户</p><p id="active-users" class="text-2xl font-bold mt-2">--</p></div>
        <div class="bg-white rounded-xl border border-slate-200 p-4"><p class="text-xs text-slate-500">冻结用户</p><p id="frozen-users" class="text-2xl font-bold mt-2">--</p></div>
        <div class="bg-white rounded-xl border border-slate-200 p-4"><p class="text-xs text-slate-500">总资产(USDT)</p><p id="total-balance" class="text-2xl font-bold mt-2">--</p></div>
      </section>

      <section class="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <div class="p-4 border-b border-slate-200 flex items-center justify-between">
          <h2 class="font-semibold">用户列表</h2>
          <button id="reload" class="text-sm px-3 py-2 rounded-lg border border-slate-300 hover:bg-slate-50">刷新</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-600">
              <tr>
                <th class="text-left p-3">UID</th>
                <th class="text-left p-3">用户名</th>
                <th class="text-left p-3">余额</th>
                <th class="text-left p-3">提现PIN</th>
                <th class="text-left p-3">状态</th>
                <th class="text-left p-3">操作</th>
              </tr>
            </thead>
            <tbody id="user-table"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script>
      const socket = io();

      function currency(value) {
        return new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value);
      }

      async function loadSummary() {
        const resp = await fetch('/api/admin/summary');
        const summary = await resp.json();
        document.getElementById('total-users').textContent = summary.totalUsers;
        document.getElementById('active-users').textContent = summary.activeUsers;
        document.getElementById('frozen-users').textContent = summary.frozenUsers;
        document.getElementById('total-balance').textContent = currency(summary.totalBalance);
      }

      async function loadUsers() {
        const resp = await fetch('/api/admin/users');
        const users = await resp.json();
        document.getElementById('user-table').innerHTML = users
          .map(
            (u) => `
            <tr class="border-t border-slate-100">
              <td class="p-3 font-mono">${u.uid}</td>
              <td class="p-3">${u.username}</td>
              <td class="p-3">${currency(u.balance)}</td>
              <td class="p-3">${u.withdrawPin}</td>
              <td class="p-3">${u.isFrozen ? '<span class="text-red-600 font-medium">已冻结</span>' : '<span class="text-emerald-600 font-medium">正常</span>'}</td>
              <td class="p-3">
                <button class="px-3 py-1.5 rounded-lg border ${u.isFrozen ? 'border-emerald-300 text-emerald-700' : 'border-red-300 text-red-700'}" onclick="toggleFreeze('${u.uid}', ${!u.isFrozen})">
                  ${u.isFrozen ? '解冻' : '冻结'}
                </button>
              </td>
            </tr>
          `
          )
          .join('');
      }

      async function toggleFreeze(uid, status) {
        const resp = await fetch('/api/admin/freeze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid, status }),
        });

        if (!resp.ok) {
          alert('操作失败');
          return;
        }

        await Promise.all([loadSummary(), loadUsers()]);
      }

      socket.on('admin_user_updated', () => {
        loadSummary();
        loadUsers();
      });

      document.getElementById('reload').addEventListener('click', () => {
        loadSummary();
        loadUsers();
      });

      loadSummary();
      loadUsers();
    </script>
  </body>
</html>
