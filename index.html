<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta-Trading Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-white p-6">
    <div class="bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-700">
        <p class="text-gray-400 text-xs font-bold mb-1 uppercase text-left">Total Assets (USDT)</p>
        <h1 class="text-4xl font-bold mb-6 text-left">5,000.00</h1>
        <div class="grid grid-cols-2 gap-4">
            <button class="bg-yellow-500 text-black py-3 rounded-xl font-bold">Withdraw</button>
            <button class="bg-slate-700 py-3 rounded-xl font-bold border border-slate-600">Deposit</button>
        </div>
    </div>
    <div class="mt-8 text-left">
        <h3 class="font-bold mb-4 text-gray-300">Markets</h3>
        <div class="bg-slate-800 p-4 rounded-2xl flex justify-between items-center border border-slate-700 mb-4">
            <div><p class="font-bold">BTC/USDT</p><p class="text-xs text-gray-500">Bitcoin</p></div>
            <div class="text-right"><p class="font-bold text-white">98,241.50</p><p class="text-xs text-green-500">+2.3%</p></div>
        </div>
    </div>
    <script>
        const socket = io();
        socket.on('freeze_status_1001', (data) => {
            if(data.isFrozen) {
                document.body.innerHTML = '<div class="fixed inset-0 bg-black flex items-center justify-center p-8 text-center"><h1 class="text-red-500 text-2xl font-bold">ACCOUNT FROZEN</h1></div>';
            }
        });
    </script>
</body>
</html>
